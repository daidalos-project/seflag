# LatinCy lemmatization on the test sets of all Latin UD 2.15 treebanks, hosted on the Hugging Face Hub.
# The result for la_core_web_lg 3.9.8 is in the package README (91.96%); v1.0.0 of SEFLAG used LatinCy 3.7.4.
name: latincy-lg-lemma-ud-latin
language: la
task: lemmatization
dataset:
  source: huggingface
  repo: daidalos-project/latin_treebanks_ud_test
  revision: 14ab3708f8f55eaa700ac5828cb3351fe5346474   # pinned for reproducibility
  split: test
model:
  backend: spacy
  name: la_core_web_lg
  # same components as excluded in the original lemma.py; LatinCy >= 3.9 splits enclitics (-que, -ne, ...) itself, which changes the gold tokens
  exclude: [enclitic_splitter, morphologizer, parser, tagger, ner]
options:
  label_normalization: []
