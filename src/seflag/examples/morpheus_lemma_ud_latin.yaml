# Morpheus lemmatization on the test sets of all Latin UD 2.15 treebanks (Hugging Face Hub).
# Morpheus analyses words out of context; with several candidate lemmas, the first one is used.
# Requires a local Morpheus installation (path below or $MORPHEUS_PATH).
name: morpheus-lemma-ud-latin
language: la
task: lemmatization
dataset:
  source: huggingface
  repo: daidalos-project/latin_treebanks_ud_test
  revision: 14ab3708f8f55eaa700ac5828cb3351fe5346474   # pinned for reproducibility
  split: test
model:
  backend: morpheus
  select: first
  unknown: empty      # unanalysable words count as errors
options:
  # Morpheus marks homonyms with numbers (e.g. 'sum#1') and writes 'v' where most UD treebanks write 'u'
  label_normalization: [strip_homonym_digits, v_to_u]
