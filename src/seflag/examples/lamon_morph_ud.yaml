# Lamon (lamonpy 0.2.0) morphological features on the test sets of all Latin UD 2.15 treebanks (Hugging Face Hub).
# Lamon's Perseus tags are converted to the UD features Person, Number, Tense, Aspect, Mood, VerbForm, Voice,
# Gender, Case and Degree. Runs lamonpy in a separate Python 3.8 environment that uv creates on first use.
name: lamon-feats-ud-latin
language: la
task:
  type: morphology
  features: model     # only the 10 features above; "universal" (as for LatinCy) also scores features Lamon lacks
  with_upos: true
dataset:
  source: huggingface
  repo: daidalos-project/latin_treebanks_ud_test
  revision: 14ab3708f8f55eaa700ac5828cb3351fe5346474   # pinned for reproducibility
  split: test
model:
  backend: lamon
  workers: 4          # threads; does not change the results
