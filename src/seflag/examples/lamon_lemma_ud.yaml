# Lamon (lamonpy 0.2.0) lemmatization on the test sets of all Latin UD 2.15 treebanks (Hugging Face Hub).
# lamonpy has wheels only up to Python 3.8: SEFLAG runs it in a separate Python 3.8 environment that uv creates
# on first use (needs uv: https://docs.astral.sh/uv/; downloads Python 3.8 and lamonpy once).
name: lamon-lemma-ud-latin
language: la
task: lemmatization
dataset:
  source: huggingface
  repo: daidalos-project/latin_treebanks_ud_test
  revision: 14ab3708f8f55eaa700ac5828cb3351fe5346474   # pinned for reproducibility
  split: test
model:
  backend: lamon
  workers: 4          # threads; does not change the results
options:
  # Lamon numbers homonyms ('cum2') and writes 'v' and 'j' where most UD treebanks write 'u' and 'i'
  label_normalization: [strip_homonym_digits, v_to_u, j_to_i]
